_schema-version: 3.3.0
ID: cnma-internallunchorder
version: 1.0.0
description: "Lunch Order Cloud Foundry MTA"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production

# = = = = = = = = = = = = = = = = = = = = = = = = = = MODULE SPACE = = = = = = = = = = = = = = = = = = = = = = = = = = #
modules:
  # ------------------------------------------------------------
  # (1) DB MODULE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_db
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 512M
      no-route: true
      no-start: true
      tasks: # execute hdi deployer on app creation/update
        - name: hdi-deploy
          command: npm run start
    requires:
      - name: cnma_hdi_container
      - name: cnma_internallunchorder_xsuaa

  # ------------------------------------------------------------
  # (2) SERVICE MODULE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      disk-quota: 512M
    provides:
      - name: srv-api
        properties:
          srv-url: "${default-url}"
    requires:
      - name: cnma_hdi_container
      - name: cnma_internallunchorder_xsuaa
      - name: cnma_internallunchorder_destination
      - name: cnma_internallunchorder_connectivity

  # ------------------------------------------------------------
  # (3) UI MODULE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_ui
    type: html5
    path: app/lunch-ui
    parameters:
      no-route: true
      no-start: true
    requires:
      - name: cnma_internallunchorder_destination
    build-parameters:
      supported-platforms: []
      build-result: .
      builder: custom
      commands:
        - npm ci
        - npm run build
      ignore: ["node_modules/", "src/", "public/", "dist/"]

  # ------------------------------------------------------------
  # (4) UI DEPLOYER MODULE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_ui_deployer
    type: com.sap.application.content
    path: app/ui-deployer
    requires:
      - name: cnma_internallunchorder_html5_host
        parameters:
          content-target: true
    build-parameters:
      build-result: .
      requires:
        - artifacts:
            - lunchorder.zip
          name: cnma_internallunchorder_ui
          target-path: .

  # ------------------------------------------------------------
  # (5) UI REPO REGISTRY MODULE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_destination_content
    type: com.sap.application.content    

    requires:
    - name: cnma_internallunchorder_xsuaa
      parameters:
        service-key:
          name: cnma_internallunchorder_xsuaa_key

    - name: cnma_internallunchorder_html5_host
      parameters:
        service-key:
          name: cnma_internallunchorder_html5_host_key

    - name: cnma_internallunchorder_destination
      parameters:
        content-target: true   

    - name: cnma_internallunchorder_connectivity

    build-parameters:
      no-source: true
    parameters:      
      content:
        instance:
          existing_destinations_policy: update                     
          destinations:
          - Name: cnma_internallunchorder_html5_dest
            ServiceInstanceName: cnma_internallunchorder_html5_host
            ServiceKeyName: cnma_internallunchorder_html5_host_key
            sap.cloud.service: lunchorder    
              
          - Name: cnma_internallunchorder_xsuaa_dest
            Authentication: OAuth2UserTokenExchange
            ServiceInstanceName: cnma_internallunchorder_xsuaa
            ServiceKeyName: cnma_internallunchorder_xsuaa_key
            sap.cloud.service: lunchorder
# = = = = = = = = = = = = = = = = = = = = = = = = = = RESOURCE SPACE = = = = = = = = = = = = = = = = = = = = = = = = = = #
resources:
  # ------------------------------------------------------------
  # (1) XSUAA RESOURCE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
      config:
        xsappname: lunchorder
        tenant-mode: dedicated

  # ------------------------------------------------------------
  # (2) HANA HDI CONTAINER SERVICE INSTANCE
  # ------------------------------------------------------------
  - name: cnma_hdi_container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ------------------------------------------------------------
  # (3) HTML5 APP REPO HOST INSTANCE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_html5_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ------------------------------------------------------------
  # (4) DESTINATION SERVICE INSTANCE
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                Description: Lunch Order Service destination
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                HTML5.Timeout: 600000

  # ------------------------------------------------------------
  # (5) CONNECTIVITY INSTANCES
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # ------------------------------------------------------------
  # (6) HTML5 RUNTIME
  # ------------------------------------------------------------
  - name: cnma_internallunchorder_html5_runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

